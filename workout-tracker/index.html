<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Workout tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">

    <header class="app-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <rect x="2" y="7" width="4" height="10" rx="1.5" fill="var(--grape-soda)"/>
            <rect x="18" y="7" width="4" height="10" rx="1.5" fill="var(--grape-soda)"/>
            <rect x="6" y="9" width="2" height="6" rx="1" fill="var(--grape-soda)"/>
            <rect x="16" y="9" width="2" height="6" rx="1" fill="var(--grape-soda)"/>
            <rect x="8" y="10.5" width="8" height="3" rx="1.5" fill="var(--grape-soda)"/>
          </svg>
        </span>
        <h1>Workout tracker</h1>
      </div>
      <nav class="view-tabs" role="tablist" aria-label="View">
        <button class="tab-btn is-active" data-view="week" role="tab" aria-selected="true">This week</button>
        <button class="tab-btn" data-view="stats" role="tab" aria-selected="false">Stats</button>
      </nav>
    </header>

    <main id="week-view" class="view">
      <div class="week-nav">
        <button class="icon-btn" id="prev-week" aria-label="Previous week">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="week-range">
          <span id="week-range-label"></span>
          <button class="link-btn" id="jump-today">Today</button>
        </div>
        <button class="icon-btn" id="next-week" aria-label="Next week">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <div class="day-list" id="day-list"></div>
    </main>

    <main id="stats-view" class="view is-hidden">
      <div class="stats-grid">
        <div class="stat-card">
          <span class="stat-label">Current streak</span>
          <span class="stat-value" id="stat-streak">0</span>
          <span class="stat-unit">days</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Total workouts logged</span>
          <span class="stat-value" id="stat-total">0</span>
          <span class="stat-unit">all time</span>
        </div>
      </div>

      <div class="trend-card">
        <div class="trend-header">
          <h2>Weekly trend</h2>
          <span class="trend-sub">Workouts completed per week, last 8 weeks</span>
        </div>
        <div id="trend-chart"></div>
        <div id="trend-empty" class="empty-state is-hidden">
          <p>Nothing logged yet. Check off a workout in "This week" and your trend will start showing up here.</p>
        </div>
      </div>
    </main>

  </div>

  <script src="app.js"></script>
</body>
</html>
